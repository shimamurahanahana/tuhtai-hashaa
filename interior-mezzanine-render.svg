  <path d="M935 403 L1124 409 L1124 423 L935 419 Z" fill="#b18a62" stroke="#624b35" stroke-width="1.5"/>
  <path d="M997 405 V421 M1060 407 V422" stroke="#76573b" stroke-width="1.5"/>
  <circle cx="1028" cy="414" r="2" fill="#ead09a"/><circle cx="1090" cy="416" r="2" fill="#ead09a"/>
  <text x="1073" y="326" text-anchor="middle" class="tiny" font-weight="700">УНТЛАГЫН МЕЗАНИН · ГАЛ ТОГООНЫ ДЭЭР</text>

  <!-- Kitchen cabinetry underneath mezzanine on rear/right wall -->
  <path d="M934 488 L1310 493 L1310 613 L934 613 Z" fill="#315d60" stroke="#23484a" stroke-width="2.5"/>
  <path d="M934 488 L1310 493 L1310 520 L934 515 Z" fill="#d4c5a8" stroke="#75634a" stroke-width="1.5"/>
