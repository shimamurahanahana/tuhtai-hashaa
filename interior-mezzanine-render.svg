  <path d="M760 329 L760 385 M836 333 L836 385 M914 336 L914 389 M992 338 L992 392 M1070 340 L1070 394 M1148 350 L1148 400 M1226 375 L1226 410 M1305 401 L1305 423" stroke="#77583d" stroke-width="3"/>
