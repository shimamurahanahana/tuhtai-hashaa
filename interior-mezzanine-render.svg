  <path d="M96 180 L780 180 L780 613 L96 613 Z" fill="none" stroke="#f8f6ea" stroke-width="12"/>
  <path d="M250 180 V613 M420 180 V613 M590 180 V613 M96 320 H780 M96 463 H780" stroke="#f7f3e7" stroke-width="9"/>
  <path d="M104 188 L104 605 M772 188 L772 605" stroke="#69807a" stroke-width="4"/>
  <!-- Curtain edge and roof beam -->
