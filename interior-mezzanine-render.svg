  <path d="M96 526 Q213 461 335 516 Q463 459 594 519 Q699 474 780 503 V613 H96 Z" fill="#78966f"/>
  <g fill="#69875f">
    <path d="M139 489 L165 413 L191 489 Z"/><path d="M154 489 L166 447 L180 489 Z"/>
    <path d="M616 467 L647 369 L678 467 Z"/><path d="M636 467 L647 416 L660 467 Z"/>
    <path d="M705 474 L731 394 L758 474 Z"/>
