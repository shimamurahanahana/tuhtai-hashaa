  <path d="M801 223 L1347 343 M801 273 L1347 392 M801 324 L1347 440 M801 375 L1347 488 M801 426 L1347 536 M801 477 L1347 584" stroke="#9c754e" stroke-width="1.5" opacity=".48"/>
  <path d="M845 194 L845 613 M927 212 L927 613 M1010 230 L1010 613 M1092 248 L1092 613 M1174 266 L1174 613 M1257 285 L1257 613 M1339 303 L1339 613" stroke="#926b49" stroke-width="1.1" opacity=".42"/>

