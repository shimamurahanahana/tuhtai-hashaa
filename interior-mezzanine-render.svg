  <path d="M96 180 L780 180 L1365 308 L666 344 Z" fill="#d8b88b" stroke="#8a6748" stroke-width="3"/>
  <path d="M96 180 L780 180 L1365 308 L666 344 Z" fill="url(#ceiling)" opacity=".88"/>
