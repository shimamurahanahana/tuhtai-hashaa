  <path d="M447 657 L615 656 L615 703 L447 704 Z" fill="#d7ccba" stroke="#807567" stroke-width="1.5"/>
  <path d="M618 659 L726 710 L726 718 L618 673 Z" fill="#d0c5b4" stroke="#807567" stroke-width="1.5"/>
  <!-- coffee table -->
  <path d="M681 684 L800 678 L850 702 L729 710 Z" fill="#d7b280" stroke="#785c3e" stroke-width="2"/>
  <path d="M700 707 V726 M831 700 V718" stroke="#77583a" stroke-width="4"/>
  <ellipse cx="765" cy="688" rx="17" ry="5" fill="#f1ece0"/>
  <!-- TV on far wall? avoid below loft seating -->
  <rect x="842" y="548" width="55" height="70" fill="#745338" stroke="#58412e" stroke-width="2"/>
  <rect x="848" y="555" width="43" height="48" fill="#273536"/>
  <text x="870" y="632" text-anchor="middle" class="micro">ТВ/номын тавиур</text>
  <!-- dining table and chairs, between kitchen and lounge -->
  <path d="M787 597 L906 583 L955 606 L834 623 Z" fill="#c89e6b" stroke="#765638" stroke-width="2"/>
  <path d="M815 618 V645 M926 603 V631" stroke="#73583b" stroke-width="4"/>
  <path d="M796 593 L776 584 L779 574 L805 584 Z M929 581 L949 574 L955 584 L936 592 Z" fill="#697f72" stroke="#516456" stroke-width="1.5"/>
  <text x="869" y="654" text-anchor="middle" class="micro">дэлгэгддэг хоолны ширээ</text>

  <!-- Wood feature wall and small decor -->
  <path d="M780 180 L1365 308" stroke="#684a32" stroke-width="7"/>
  <rect x="826" y="378" width="55" height="67" fill="#f1e6cf" stroke="#775b3f" stroke-width="3"/>
  <rect x="833" y="385" width="41" height="52" fill="#6d8278"/>
  <text x="851" y="458" text-anchor="middle" class="micro">чимэглэл</text>
  <!-- floor cushions / plant -->
  <ellipse cx="559" cy="742" rx="37" ry="10" fill="#7e5c3d" opacity=".25"/>
  <path d="M534 719 Q559 703 584 719 Q580 739 559 742 Q538 739 534 719Z" fill="#728d7a" stroke="#526b58" stroke-width="1.5"/>
  <path d="M558 714 Q552 693 539 687 M561 714 Q568 691 582 685 M558 715 Q559 692 559 679" stroke="#547451" stroke-width="3" fill="none"/>
  <path d="M532 712 Q540 700 550 711 M565 705 Q577 696 585 708 M549 693 Q552 680 560 678" stroke="#799875" stroke-width="6"/>

  <!-- Callout indicators -->
  <rect x="75" y="155" width="275" height="60" rx="11" fill="#fffefa" fill-opacity=".94" stroke="#dce4da"/>
  <text x="92" y="180" class="label">ӨНДӨР ШИЛЭН ФАСАД</text>
  <text x="92" y="199" class="tiny">нар авдаг талд · дулаан шил, гадна сүүдрэвчтэй</text>
  <path d="M259 216 L285 264" stroke="#5d7c72" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="1040" y="151" width="320" height="58" rx="11" fill="#fffefa" fill-opacity=".94" stroke="#dce4da"/>
  <text x="1200" y="175" text-anchor="middle" class="label">УНТЛАГЫН МЕЗАНИН</text>
  <text x="1200" y="194" text-anchor="middle" class="tiny">өндөр шүүгээ/гал тогооны дээр байрлана</text>
  <path d="M1199 211 L1176 340" stroke="#5d7c72" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="103" y="782" width="285" height="54" rx="11" fill="#fffefa" fill-opacity=".94" stroke="#dce4da"/>
  <text x="245" y="805" text-anchor="middle" class="label">ЗОЧНЫ ХЭСЭГ ДАВХАР ӨНДӨР</text>
  <text x="245" y="823" text-anchor="middle" class="tiny">буйдангийн дээр мезанин байхгүй</text>
  <path d="M389 795 L546 708" stroke="#5d7c72" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <rect x="35" y="925" width="1430" height="100" rx="17" fill="#30473b"/>
  <text x="66" y="959" class="white" font-size="16" font-weight="700">ТӨЛӨВЛӨЛТИЙН ЗАСВАР</text>
  <text x="66" y="985" class="pale" font-size="13">Зөв: унтлагын хэсэг гал тогооны өндөр шүүгээний дээгүүр · доор нь гал тогоо · буйдангийн тал давхар өндөр, задгай хэвээр.</text>
  <text x="66" y="1008" fill="#c3d1c5" font-size="11">Энэ нь холбоосын зурагтай ижил байшинг хуулсан зураг биш, зөвхөн модон өнгө ба өндөр шиллэгээний санааг авсан концепц. Бодит өндөр, мезанины даац/гарц/хашлага, цонхны дулаан үзүүлэлтийг мэргэжлийн зураг төслөөр тооцно.</text>
</svg>
