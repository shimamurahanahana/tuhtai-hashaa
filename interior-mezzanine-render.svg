  <path d="M965 483 V476 Q985 462 1003 481" fill="none" stroke="#647f79" stroke-width="2.5"/>
  <ellipse cx="1136" cy="491" rx="16" ry="4" fill="#4c4944"/><ellipse cx="1182" cy="492" rx="16" ry="4" fill="#4c4944"/>
  <circle cx="1136" cy="489" r="2" fill="#d4bd91"/><circle cx="1182" cy="490" r="2" fill="#d4bd91"/>
  <!-- Oven/fridge vertical -->
  <rect x="1260" y="520" width="39" height="84" fill="#273b3d" stroke="#c7d6cf" stroke-width="2"/>
  <rect x="1267" y="529" width="25" height="34" fill="#80999a"/>
  <path d="M1264 574 H1295" stroke="#8ba2a0" stroke-width="2"/>
  <text x="1173" y="638" text-anchor="middle" class="tiny">гал тогооны өндөр шүүгээ · суурин доор хадгалалт/тоноглол</text>
  <!-- Range hood duct -->
  <path d="M1157 446 V477 M1133 478 H1202 L1188 488 H1147 Z" fill="#9aa7a1" stroke="#58645d" stroke-width="2"/>
  <path d="M1170 445 V395" stroke="#808a83" stroke-width="6"/>
  <text x="1213" y="462" class="micro">сорох шүүгээ</text>

  <!-- Open double-height lounge in foreground -->
  <path d="M300 611 L839 609 L1091 743 L524 757 Z" fill="url(#floor)" stroke="#735339" stroke-width="2.5"/>
  <path d="M300 611 L839 609 L1091 743 L524 757 Z" fill="url(#planks)" opacity=".72"/>
  <!-- living rug -->
  <path d="M380 627 L714 625 L900 715 L562 727 Z" fill="#d7d0c0" stroke="#ada18e" stroke-width="2"/>
  <path d="M401 635 L703 633 L868 712 L566 720 Z" fill="#d4d9ce" opacity=".7"/>
  <!-- sectional sofa -->
  <path d="M431 626 L618 625 L747 688 L745 727 L560 732 L431 671 Z" fill="#a89a85" stroke="#6d6358" stroke-width="3"/>
  <path d="M431 626 L618 625 L618 652 L431 653 Z" fill="#c8bba6" stroke="#76695b" stroke-width="2"/>
