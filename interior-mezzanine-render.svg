<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc" style="display:block;max-width:1500px;height:auto">
  <title id="title">Модон дотор засал, гал тогооны дээгүүр унтлагын мезанинтай зочны өрөөний 3D концепц</title>
  <desc id="desc">Хэрэглэгчийн жишээ зурагт тулгуурласан өндөр шиллэгээ, модон хана тааз, нээлттэй зочны хэсэг, гал тогооны дээгүүрх унтлагын мезанины концепц дүрслэл.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8eaf0"/>
      <stop offset="1" stop-color="#f7f0dc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0e4"/>
      <stop offset="1" stop-color="#78a8ae"/>
    </linearGradient>
    <linearGradient id="woodwall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b98c"/>
      <stop offset="1" stop-color="#b7895f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd9163"/>
      <stop offset="1" stop-color="#9b704c"/>
    </linearGradient>
    <pattern id="planks" width="120" height="26" patternUnits="userSpaceOnUse" patternTransform="skewY(-17)">
      <path d="M0 2 H120 M0 24 H120 M30 2 V24 M91 2 V24" fill="none" stroke="#78583e" stroke-width="1.1" opacity=".38"/>
    </pattern>
    <pattern id="ceiling" width="32" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 2 H32 M0 16 H32" stroke="#9a714d" stroke-width="1.2" opacity=".48"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#53755d"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #293b34; }
      .title { font-size: 31px; font-weight: 750; }
      .subtitle { font-size: 15px; fill: #62756a; }
      .head { font-size: 19px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 11px; fill: #52665a; }
      .tiny { font-size: 9px; fill: #52665a; }
      .white { fill: #fff; }
      .pale { fill: #e5eee6; }
    </style>
  </defs>
  <rect width="1500" height="1050" fill="#f5f3ec"/>
  <text x="48" y="56" class="title">ДОТОР ОРЧИН · МЕЗАНИНЫГ ГАЛ ТОГООНЫ ДЭЭР БАЙРЛУУЛСАН НЬ</text>
  <text x="51" y="84" class="subtitle">Таны явуулсан жишээний модон дулаан төрх + өндөр цонх + нээлттэй зочны хэсгийн санаа</text>
  <rect x="1220" y="39" width="235" height="35" rx="17" fill="#e6eee5"/>
  <text x="1337" y="61" text-anchor="middle" class="small" font-weight="700">5.5 × 7 м СУУРЬ · КОНЦЕПЦ</text>

  <!-- Render frame -->
  <rect x="35" y="115" width="1430" height="785" rx="22" fill="#fffefa" stroke="#dce4da" stroke-width="1.5"/>
  <rect x="57" y="137" width="1386" height="741" rx="15" fill="#f1eee5"/>

  <!-- Outside view through glazing -->
