  <circle cx="1000" cy="560" r="3" fill="#e1d2b7"/><circle cx="1077" cy="561" r="3" fill="#e1d2b7"/>
  <circle cx="1155" cy="562" r="3" fill="#e1d2b7"/><circle cx="1232" cy="563" r="3" fill="#e1d2b7"/>
