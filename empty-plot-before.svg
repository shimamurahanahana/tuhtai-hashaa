<svg xmlns="http://www.w3.org/2000/svg" width="1632" height="960" viewBox="0 0 1632 960" font-family="Arial, Helvetica, sans-serif">
  <!-- Empty plot today, top-down, 22 px = 1 m. Road on top (NE side), sibling's plot on the left (NW side). -->
  <defs>
    <pattern id="steppe" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#CFC08F"/>
      <path d="M8 14 l3 -7 M11 14 l0 -8 M14 14 l-2 -7" stroke="#A9975F" stroke-width="2" stroke-linecap="round"/>
      <path d="M38 40 l3 -7 M41 40 l0 -8 M44 40 l-2 -7" stroke="#B3A26C" stroke-width="2" stroke-linecap="round"/>
      <path d="M46 12 l2 -5 M49 12 l0 -6" stroke="#B8A873" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 52 l2 -5 M21 52 l0 -6 M24 52 l-2 -5" stroke="#A8965E" stroke-width="2" stroke-linecap="round"/>
      <circle cx="30" cy="22" r="1.6" fill="#B09D66"/><circle cx="54" cy="50" r="1.4" fill="#BBAA75"/>
    </pattern>
    <pattern id="gravel" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D6CCB8"/><circle cx="3" cy="3" r="1.3" fill="#B7AC97"/><circle cx="7" cy="7" r="1.1" fill="#C4B9A4"/>
    </pattern>
  </defs>

  <rect width="1632" height="960" fill="url(#steppe)"/>

  <!-- Gravel road along the NE side -->
  <rect x="0" y="70" width="1632" height="120" fill="url(#gravel)"/>
  <path d="M0 110 H1632 M0 150 H1632" stroke="#C2B69E" stroke-width="6" stroke-dasharray="40 30" opacity="0.7"/>
  <text x="1400" y="140" font-size="30" font-weight="bold" fill="#6B604C" letter-spacing="3">ЗАМ</text>

  <!-- Neighbouring plots (faint outlines) -->
  <g fill="none" stroke="#8C7C55" stroke-width="3" stroke-dasharray="14 10" opacity="0.75">
    <rect x="-60" y="230" width="550" height="616"/>
    <rect x="1142" y="230" width="560" height="616"/>
    <rect x="508" y="864" width="616" height="200"/>
  </g>
  <text x="70" y="540" font-size="32" font-weight="bold" fill="#7A3E2E">Хөрш</text>
  <text x="70" y="580" font-size="24" fill="#7A3E2E">4117033010</text>
  <text x="1220" y="540" font-size="26" fill="#6B604C">Хөрш</text>

  <!-- Our plot: 28 m x 25 m = 616 x 550 px, staked boundary -->
  <rect x="508" y="230" width="616" height="550" fill="#D8CA98" opacity="0.55"/>
  <rect x="508" y="230" width="616" height="550" fill="none" stroke="#D2691E" stroke-width="6" stroke-dasharray="22 12"/>
  <g fill="#8B5A2B" stroke="#5A3A1A" stroke-width="2">
    <rect x="500" y="222" width="16" height="16"/><rect x="1116" y="222" width="16" height="16"/>
    <rect x="1116" y="772" width="16" height="16"/><rect x="500" y="772" width="16" height="16"/>
  </g>

  <!-- Labels -->
  <rect x="616" y="420" width="400" height="170" rx="14" fill="#FBF7EE" opacity="0.92"/>
  <text x="816" y="474" font-size="30" font-weight="bold" fill="#8F5017" text-anchor="middle">ТӨСӨЛ ХЭРЭГЖИХ ГАЗАР</text>
  <text x="816" y="516" font-size="28" fill="#3D342C" text-anchor="middle">4117033007</text>
  <text x="816" y="560" font-size="28" fill="#3D342C" text-anchor="middle">≈ 700 м² · хоосон тал</text>

  <!-- Dimensions -->
  <rect x="756" y="205" width="120" height="34" rx="6" fill="#FBF7EE"/>
  <text x="816" y="231" font-size="26" font-weight="bold" fill="#3D342C" text-anchor="middle">≈ 28 м</text>
  <rect x="453" y="486" width="110" height="34" rx="6" fill="#FBF7EE" transform="rotate(-90 508 503)"/>
  <text x="508" y="512" font-size="26" font-weight="bold" fill="#3D342C" text-anchor="middle" transform="rotate(-90 508 503)">24.98 м</text>

  <!-- North arrow (drawing up = NE) -->
  <g transform="translate(1540,880) rotate(-58.5)">
    <circle r="34" fill="#FBF7EE" stroke="#3D342C" stroke-width="2"/>
    <path d="M0 -28 L10 9 L0 3 L-10 9 Z" fill="#C62828"/>
  </g>
  <text x="1500" y="830" font-size="22" font-weight="bold" fill="#C62828">Х</text>
</svg>
