  <rect x="872" y="333" width="64" height="69" rx="4" fill="#d1dfe0" stroke="#789094" stroke-width="2"/>
  <text x="904" y="360" text-anchor="middle" class="roomsmall">хөргөгч</text>
  <text x="904" y="376" text-anchor="middle" class="roomsmall">хөлдөөгч</text>
  <rect x="945" y="333" width="96" height="69" rx="4" fill="#c8b49c" stroke="#786a57" stroke-width="2"/>
  <text x="993" y="360" text-anchor="middle" class="roomsmall">шарах шүүгээ</text>
  <text x="993" y="377" text-anchor="middle" class="roomsmall">+ печ</text>
  <rect x="1052" y="333" width="76" height="69" rx="4" fill="#e5d4b9" stroke="#a78b63" stroke-width="2"/>
  <text x="1090" y="359" text-anchor="middle" class="roomsmall">хийн</text>
  <text x="1090" y="376" text-anchor="middle" class="roomsmall">плитка</text>
  <path d="M1090 332 V283" stroke="#8a7560" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1105" y="278" class="tiny">сорох шүүгээ → гадагш</text>
  <rect x="1140" y="266" width="85" height="136" rx="5" fill="#d8e3d4" stroke="#7e9479" stroke-width="2"/>
  <text x="1182" y="301" text-anchor="middle" class="roomsmall">ариун</text>
  <text x="1182" y="317" text-anchor="middle" class="roomsmall">цэврийн</text>
  <text x="1182" y="333" text-anchor="middle" class="roomsmall">өрөө</text>
  <text x="1182" y="365" text-anchor="middle" class="tiny">жорлон</text>
  <text x="1182" y="380" text-anchor="middle" class="tiny">шүршүүр</text>
  <text x="1182" y="393" text-anchor="middle" class="tiny">угаалтуур</text>

  <!-- living room -->
  <rect x="856" y="421" width="388" height="273" fill="#f4e5cd" stroke="#d2b98f" stroke-width="1.5"/>
  <text x="1048" y="446" text-anchor="middle" class="room">ДАВХАР ӨНДӨР ЗОЧНЫ ХЭСЭГ</text>
  <rect x="878" y="474" width="122" height="52" rx="18" fill="#95a79a" stroke="#62786a" stroke-width="2"/>
  <rect x="878" y="532" width="122" height="28" rx="10" fill="#819789" stroke="#62786a" stroke-width="2"/>
  <text x="939" y="506" text-anchor="middle" class="roomsmall" fill="#fff">буйдан</text>
  <rect x="1015" y="486" width="86" height="54" rx="5" fill="#c89f6e" stroke="#8b6840" stroke-width="2"/>
  <text x="1058" y="509" text-anchor="middle" class="roomsmall">хооллох</text>
  <text x="1058" y="524" text-anchor="middle" class="roomsmall">ширээ</text>
  <rect x="1120" y="478" width="96" height="48" rx="5" fill="#ba9469" stroke="#8b6840" stroke-width="2"/>
  <text x="1168" y="507" text-anchor="middle" class="roomsmall">намхан зуух</text>
  <path d="M906 576 C954 598 1006 599 1052 575" fill="none" stroke="#d6b879" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="1047" y="632" text-anchor="middle" class="roomsmall">чөлөөтэй хөдөлгөөн · хадгалах тавилга хананд</text>
  <text x="1047" y="660" text-anchor="middle" class="tiny">урд талын том цонх · гадна сүүдрэвч/хөшиг</text>
  <path d="M912 699 V680 M1028 699 V680 M1144 699 V680" stroke="#6c8790" stroke-width="10"/>

  <!-- vestibule / entrance -->
  <rect x="856" y="696" width="145" height="120" fill="#e1e7dd" stroke="#9aaa95" stroke-width="1.5"/>
  <text x="928" y="718" text-anchor="middle" class="roomsmall">САЛХИНЫ ТАМБУР</text>
  <rect x="869" y="732" width="76" height="28" rx="3" fill="#b9aa94"/>
  <text x="907" y="751" text-anchor="middle" class="tiny">гутлын шүүгээ</text>
  <rect x="951" y="732" width="38" height="66" rx="3" fill="#d1c3ae"/>
  <text x="970" y="773" text-anchor="middle" class="tiny" transform="rotate(-90 970 773)">хувцасны өлгүүр</text>
  <path d="M1001 780 H1030" stroke="#536c5c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1018" y="805" class="tiny">үндсэн хаалга</text>

  <!-- entry window rays -->
  <circle cx="1393" cy="303" r="32" fill="#f5c65f"/>
  <path d="M1393 252 V237 M1393 369 V354 M1342 303 H1327 M1459 303 H1444 M1357 267 L1346 256 M1440 350 L1429 339 M1429 267 L1440 256 M1346 350 L1357 339" stroke="#d69b37" stroke-width="3"/>
  <text x="1393" y="398" text-anchor="middle" class="small">ӨМНӨД</text>
  <path d="M1367 436 L1272 496" fill="none" stroke="#dc9b33" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#sunArrow)"/>
  <path d="M1389 447 L1278 536" fill="none" stroke="#dc9b33" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#sunArrow)"/>
  <text x="1385" y="478" text-anchor="middle" class="tiny">өвлийн нам нар</text>

  <!-- mezzanine inset -->
  <rect x="1340" y="535" width="176" height="236" rx="12" fill="#eef2e9" stroke="#a8b6a2" stroke-width="1.5"/>
  <text x="1428" y="561" text-anchor="middle" class="label">МЕЗАНИН</text>
  <text x="1428" y="579" text-anchor="middle" class="tiny">зөвхөн хойд хэсгийн дээр</text>
  <rect x="1360" y="597" width="138" height="74" rx="7" fill="#d8c6a9" stroke="#987c58" stroke-width="2"/>
  <rect x="1375" y="612" width="108" height="44" rx="14" fill="#f1eadc" stroke="#9f927f" stroke-width="2"/>
  <text x="1429" y="637" text-anchor="middle" class="roomsmall">намхан платформ ор</text>
  <text x="1428" y="696" text-anchor="middle" class="tiny">доор хадгалах шургуулга</text>
  <path d="M1380 718 L1410 683 M1395 718 L1425 683 M1410 718 L1440 683" stroke="#7d725e" stroke-width="3"/>
  <text x="1428" y="750" text-anchor="middle" class="tiny">шат + хамгаалалтын бариул</text>

  <!-- notes strip -->
  <rect x="55" y="875" width="1490" height="185" rx="22" fill="#31473c"/>
  <text x="85" y="916" class="white" font-size="21" font-weight="700">ЭХНИЙ ЭЭЛЖИД</text>
  <text x="85" y="947" class="pale" font-size="14">Хөрсний/өндөршлийн судалгаа · дулаан алдагдал багатай сууц · зуух ба аюулгүй яндан · нарны систем · ус/бохирын мэргэжлийн шийдэл</text>
  <line x1="85" y1="967" x2="1510" y2="967" stroke="#718477" stroke-width="1"/>
  <text x="85" y="996" class="pale" font-size="13">Дараагийн үе шат: гарааш · 6 хүний зуны зочны байр · хүлэмж · саравч/мах шарах хэсэг · тоглоомын болон practice талбай</text>
  <text x="85" y="1025" class="softwhite" font-size="12">Тайлбар: энэ зураглал нь ярилцлагын санааг ойлгомжтой болгох концепц. Газрын хил, хойд зүг, налуу, хөрс, салхи, нарны бодит зам, барилгын норм ба төсвөөр заавал шинэчилнэ.</text>
  <text x="1510" y="1025" class="softwhite" text-anchor="end" font-size="11">КОНЦЕПЦ · ХЭМЖЭЭНИЙ ЗУРАГ БИШ</text>
</svg>
