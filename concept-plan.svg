<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc" style="display:block;max-width:1600px;height:auto">
  <title id="title">Баянцогт сум дахь жижиг сууц, газрын зохион байгуулалтын эхний концепц</title>
  <desc id="desc">0.7 га налуу газрын урьдчилсан бүдүүвч болон 5.5x7 метр байшингийн давхарын схем. Зөвхөн ярилцлагын санаанд тулгуурласан, хэмжилтээр баталгаажаагүй.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#e9eee7"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8a3" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="contours" width="360" height="145" patternUnits="userSpaceOnUse">
      <path d="M-30 40 C55 5 112 83 208 38 S328 11 395 52" fill="none" stroke="#a9b99e" stroke-width="2" opacity=".6"/>
      <path d="M-35 78 C45 41 119 121 208 76 S326 47 395 91" fill="none" stroke="#a9b99e" stroke-width="2" opacity=".5"/>
      <path d="M-25 116 C54 79 116 156 213 113 S329 84 395 128" fill="none" stroke="#a9b99e" stroke-width="2" opacity=".4"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#668472"/>
    </marker>
    <marker id="sunArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc9b33"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #293b34; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: .2px; }
      .subtitle { font-size: 16px; fill: #63766b; }
      .paneltitle { font-size: 21px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #586c61; }
      .tiny { font-size: 10px; fill: #607267; }
      .room { font-size: 14px; font-weight: 700; }
      .roomsmall { font-size: 11px; fill: #596c62; }
      .white { fill: #fff; }
      .pale { fill: #e4ece4; }
      .softwhite { fill: #bdcec0; }
      .card { fill: #fffefa; stroke: #dce3da; stroke-width: 1.5; }
      .outline { stroke: #536c5c; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#paper)"/>
  <circle cx="1480" cy="85" r="120" fill="#fff1c6" opacity=".45"/>
  <text x="60" y="64" class="title">БАЯНЦОГТ СУМ · ЖИЖИГ СУУЦНЫ ЭХНИЙ САНАА</text>
  <text x="62" y="94" class="subtitle">Нэгж талбар № 41703307 · 2 хүний жилийн сууц · зуны 6 зочин · урьдчилсан концепц, барилгын зураг биш</text>
  <rect x="1300" y="42" width="240" height="36" rx="18" fill="#e7efe8"/>
  <text x="1420" y="65" text-anchor="middle" class="small" font-weight="700">НАРИЙВЧЛАХ ШАТ 01</text>

  <!-- Site concept -->
  <rect x="55" y="130" width="735" height="720" rx="22" class="card"/>
  <text x="82" y="171" class="paneltitle">1 · ГАЗРЫН ЕРӨНХИЙ БАЙРШИЛ</text>
  <text x="82" y="195" class="small">0.7 га талбайн жишиг бүдүүвч · хил, хэмжээ, бодит чиглэлээр баталгаажаагүй</text>

  <rect x="82" y="220" width="680" height="545" rx="18" fill="#eef3e8" stroke="#aebda8" stroke-width="2"/>
  <rect x="82" y="220" width="680" height="545" rx="18" fill="url(#contours)" opacity=".8"/>
  <text x="105" y="249" class="tiny" letter-spacing="2">БАРУУН · ДЭЭД ТАЛ</text>
  <text x="742" y="249" text-anchor="end" class="tiny" letter-spacing="2">ЗҮҮН · ДООД ТАЛ</text>

  <!-- Upslope runoff / direction -->
  <path d="M125 300 C280 277 430 300 690 270" fill="none" stroke="#6d9b84" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="180" y="286" class="small">Дээд талын гадаргын усыг тосож зайлуулах</text>
  <path d="M250 635 L610 635" fill="none" stroke="#678976" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="360" y="655" class="small">Налуу: баруунаас зүүн тийш (баталгаажуулах)</text>

  <!-- North marker -->
  <path d="M715 290 L715 255" stroke="#293b34" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="715" y="244" text-anchor="middle" class="label">Х</text>
  <text x="715" y="312" text-anchor="middle" class="tiny">ХОЙД</text>

  <!-- Main house -->
  <rect x="328" y="383" width="185" height="138" rx="8" fill="#d9a66b" stroke="#765638" stroke-width="3"/>
  <path d="M318 392 L420 340 L523 392" fill="#bd8252" stroke="#765638" stroke-width="3"/>
  <rect x="355" y="407" width="130" height="67" rx="5" fill="#f6e8cd" stroke="#765638" stroke-width="2"/>
  <path d="M420 408 V474 M355 440 H485" stroke="#9e7954" stroke-width="2"/>
  <rect x="394" y="484" width="48" height="37" fill="#876c50" stroke="#614a36" stroke-width="2"/>
  <text x="420" y="460" text-anchor="middle" class="label">ҮНДСЭН СУУЦ</text>
  <text x="420" y="536" text-anchor="middle" class="small">5.5 × 7 м орчим · мезанинтай</text>
  <text x="420" y="554" text-anchor="middle" class="tiny">урд цонх нар авна</text>

  <!-- Small garage, driveway -->
  <rect x="205" y="428" width="90" height="75" rx="5" fill="#cbd7d2" stroke="#687b71" stroke-width="2"/>
  <path d="M198 433 L250 402 L302 433" fill="#98aaa0" stroke="#687b71" stroke-width="2"/>
  <rect x="226" y="457" width="47" height="46" fill="#e7ece8" stroke="#687b71" stroke-width="2"/>
