  <path d="M513 396 C533 387 539 379 550 370" fill="none" stroke="#4c91a2" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Guest accommodation and outdoor wc -->
  <rect x="541" y="482" width="83" height="65" rx="7" fill="#ead9bc" stroke="#977a52" stroke-width="2"/>
  <path d="M535 490 L582 458 L630 490" fill="#d4b98d" stroke="#977a52" stroke-width="2"/>
  <text x="582" y="524" text-anchor="middle" class="small">Зуны зочны</text>
  <text x="582" y="540" text-anchor="middle" class="small">гэр/байр · 6 ор</text>
  <rect x="646" y="493" width="55" height="45" rx="5" fill="#efece1" stroke="#7f8c78" stroke-width="2"/>
  <text x="674" y="512" text-anchor="middle" class="tiny">Зуны</text>
  <text x="674" y="526" text-anchor="middle" class="tiny">эко жорлон</text>
  <text x="674" y="548" text-anchor="middle" class="tiny">+ гар угаах</text>
  <text x="674" y="561" text-anchor="middle" class="tiny">+ шүршүүр</text>

  <!-- Future recreation / fire -->
  <ellipse cx="567" cy="650" rx="119" ry="55" fill="#e5eddb" stroke="#91a381" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="567" y="637" text-anchor="middle" class="small" font-weight="700">ДАРААГИЙН ҮЕ ШАТ</text>
  <text x="567" y="656" text-anchor="middle" class="small">хүүхдийн тоглоом · амрах хэсэг</text>
  <text x="567" y="674" text-anchor="middle" class="tiny">теннис/practice талбайг хэмжилтийн дараа</text>
  <circle cx="369" cy="664" r="27" fill="#f1d9b9" stroke="#b7834e" stroke-width="2"/>
  <circle cx="369" cy="664" r="9" fill="#db8448"/>
  <text x="369" y="710" text-anchor="middle" class="small">Галын аюулгүй зайтай</text>
  <text x="369" y="726" text-anchor="middle" class="small">мах шарах саравч</text>

  <!-- Road / entry -->
  <rect x="82" y="777" width="680" height="45" rx="8" fill="#b7b2a9"/>
  <path d="M100 799 H742" stroke="#f6f3ec" stroke-width="3" stroke-dasharray="16 12"/>
  <text x="422" y="806" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">УРД ЗАМ · ОРЦ</text>
  <path d="M175 775 L175 741" stroke="#6f806f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="175" y="733" text-anchor="middle" class="tiny">машины орц</text>

  <!-- House plan -->
  <rect x="815" y="130" width="730" height="720" rx="22" class="card"/>
  <text x="842" y="171" class="paneltitle">2 · ҮНДСЭН СУУЦНЫ ДОТОР ЗОХИОН БАЙГУУЛАЛТ</text>
  <text x="842" y="195" class="small">Газрын давхар · 5.5 × 7 м орчим · урд тал доод хэсэгт</text>
  <rect x="850" y="222" width="470" height="598" rx="10" fill="#f6f4ed" stroke="#536c5c" stroke-width="5"/>
