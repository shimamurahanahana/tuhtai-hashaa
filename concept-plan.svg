  <path d="M250 503 C240 576 200 609 174 683" fill="none" stroke="#a08c70" stroke-width="18" stroke-linecap="round" opacity=".72"/>
  <path d="M250 503 C240 576 200 609 174 683" fill="none" stroke="#efe6d7" stroke-width="2" stroke-dasharray="8 8"/>

