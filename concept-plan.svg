  <text x="1085" y="810" text-anchor="middle" class="tiny" letter-spacing="2">УРД · НАРНЫ ЦОНХ</text>

  <!-- back kitchen zone -->
  <rect x="856" y="249" width="388" height="171" fill="#e9e4d9" stroke="#c4bcae" stroke-width="1.5"/>
